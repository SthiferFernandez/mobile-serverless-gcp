services:
  database:
    image: postgres:16-alpine
    container_name: mobile_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mobile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile_fiber_api
    restart: always
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: super_secret_jwt_key_utesa_2026
      DB_TYPE: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: mobile_db
      BASE_URL: http://localhost:8080
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
