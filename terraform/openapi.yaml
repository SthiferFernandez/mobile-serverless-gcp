swagger: "2.0"
info:
  title: "Mobile Backend REST API"
  description: "API Gateway para la Aplicacion Movil con Backend Go Fiber y Cloud Run"
  version: "1.0.0"
schemes:
  - "https"
consumes:
  - "application/json"
  - "multipart/form-data"
produces:
  - "application/json"

paths:
  /health:
    get:
      summary: "Health Check"
      operationId: "getHealth"
      x-google-backend:
        address: ${cloud_run_url}/health
      responses:
        "200":
          description: "Servidor Go Fiber activo"

  /login:
    post:
      summary: "Inicio de sesion de usuario"
      operationId: "loginUser"
      x-google-backend:
        address: ${cloud_run_url}/login
      responses:
        "200":
          description: "Autenticacion exitosa y retorno de JWT"

  /register:
    post:
      summary: "Registro de nuevo usuario"
      operationId: "registerUser"
      x-google-backend:
        address: ${cloud_run_url}/register
      responses:
        "201":
          description: "Usuario registrado con exito"

  /profile:
    get:
      summary: "Obtener perfil del usuario autenticado"
      operationId: "getProfile"
      x-google-backend:
        address: ${cloud_run_url}/profile
      responses:
        "200":
          description: "Datos del perfil autenticado"

  /users:
    get:
      summary: "Listar todos los usuarios"
      operationId: "getUsers"
      x-google-backend:
        address: ${cloud_run_url}/users
      responses:
        "200":
          description: "Listado de usuarios"
    post:
      summary: "Crear un nuevo usuario"
      operationId: "createUser"
      x-google-backend:
        address: ${cloud_run_url}/users
      responses:
        "201":
          description: "Usuario creado exitosamente"

  /users/{id}:
    get:
      summary: "Obtener usuario por ID"
      operationId: "getUserById"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: ${cloud_run_url}/users
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: "Detalle del usuario"
    put:
      summary: "Actualizar usuario por ID"
      operationId: "updateUser"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: ${cloud_run_url}/users
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: "Usuario actualizado exitosamente"
    delete:
      summary: "Eliminar usuario por ID"
      operationId: "deleteUser"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: ${cloud_run_url}/users
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: "Usuario eliminado exitosamente"

  /upload:
    post:
      summary: "Subir archivo o foto"
      operationId: "uploadFile"
      x-google-backend:
        address: ${cloud_run_url}/upload
      responses:
        "200":
          description: "Archivo subido correctamente"

  /upload/{id}:
    delete:
      summary: "Eliminar archivo por ID"
      operationId: "deleteFile"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: ${cloud_run_url}/upload
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: "Archivo eliminado"

  /files:
    get:
      summary: "Listar archivos subidos"
      operationId: "getFiles"
      x-google-backend:
        address: ${cloud_run_url}/files
      responses:
        "200":
          description: "Lista de archivos"

  /stats:
    get:
      summary: "Metricas del Dashboard"
      operationId: "getStats"
      x-google-backend:
        address: ${cloud_run_url}/stats
      responses:
        "200":
          description: "Metricas y conteos"

  /notifications:
    get:
      summary: "Notificaciones del usuario"
      operationId: "getNotifications"
      x-google-backend:
        address: ${cloud_run_url}/notifications
      responses:
        "200":
          description: "Lista de notificaciones"

  /benchmark/task/{id}:
    get:
      summary: "Tarea de concurrencia benchmark"
      operationId: "benchmarkTask"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: ${cloud_run_url}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: "Resultado de tarea concurrente"

  /notifications/send:
    post:
      summary: "Publicar mensaje en Pub/Sub para envio de correo electronico"
      operationId: "sendNotification"
      x-google-backend:
        address: ${cloud_run_url}/notifications/send
      responses:
        "200":
          description: "Mensaje publicado en Pub/Sub exitosamente"
        "400":
          description: "Datos invalidos"

