name: CI/CD Pipeline - Serverless GCP Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY || 'mobile-repo' }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'mobile-backend-api' }}
  IMAGE_NAME: backend-api

jobs:
  # ==============================================================================
  # 1. BACKEND: BUILD & TEST
  # ==============================================================================
  backend-ci:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: Backend/go.sum

      - name: Instalar Dependencias
        run: |
          cd Backend
          go mod download

      - name: Ejecutar Pruebas (Test)
        run: |
          cd Backend
          go test -v ./...

      - name: Construir Proyecto (Build)
        run: |
          cd Backend
          CGO_ENABLED=0 GOOS=linux go build -v -ldflags="-w -s" -o api ./cmd/api

  # ==============================================================================
  # 2. DOCKER & ARTIFACT REGISTRY
  # ==============================================================================
  docker-artifact-registry:
    name: Docker Build & Push Artifact Registry
    needs: [backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        run: |
          cat << 'EOF' > /tmp/gcp-creds.json
          ${{ secrets.GCP_SA_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV
          echo "CLOUDSDK_CORE_PROJECT=${{ env.GCP_PROJECT_ID }}" >> $GITHUB_ENV
          CRED_TYPE=$(jq -r '.type' /tmp/gcp-creds.json)
          if [ "$CRED_TYPE" = "authorized_user" ]; then
            CLIENT_ID=$(jq -r '.client_id' /tmp/gcp-creds.json)
            CLIENT_SECRET=$(jq -r '.client_secret' /tmp/gcp-creds.json)
            REFRESH_TOKEN=$(jq -r '.refresh_token' /tmp/gcp-creds.json)
            ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=$CLIENT_ID" \
              -d "client_secret=$CLIENT_SECRET" \
              -d "refresh_token=$REFRESH_TOKEN" \
              -d "grant_type=refresh_token" | jq -r '.access_token')
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          else
            gcloud auth activate-service-account --key-file=/tmp/gcp-creds.json --project=${{ env.GCP_PROJECT_ID }}
            ACCESS_TOKEN=$(gcloud auth print-access-token)
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          fi

      - name: Configurar Docker para Artifact Registry
        run: |
          echo "$CLOUDSDK_AUTH_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Verificar o Crear Repositorio Artifact Registry
        run: |
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REGISTRY }} \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REGISTRY }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Repositorio Docker para imagenes del Backend Go Fiber" \
            --project=${{ env.GCP_PROJECT_ID }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Publicar Imagen Docker (Push)
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ==============================================================================
  # 3. TERRAFORM (INFRAESTRUCTURA COMO CÓDIGO)
  # ==============================================================================
  terraform:
    name: Terraform - Plan & Apply
    needs: [docker-artifact-registry]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION || 'us-central1' }}
      TF_VAR_repository_id: ${{ secrets.ARTIFACT_REGISTRY || 'mobile-repo' }}
      TF_VAR_service_name: ${{ secrets.CLOUD_RUN_SERVICE || 'mobile-backend-api' }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        run: |
          cat << 'EOF' > /tmp/gcp-creds.json
          ${{ secrets.GCP_SA_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV
          echo "CLOUDSDK_CORE_PROJECT=${{ env.GCP_PROJECT_ID }}" >> $GITHUB_ENV
          CRED_TYPE=$(jq -r '.type' /tmp/gcp-creds.json)
          if [ "$CRED_TYPE" = "authorized_user" ]; then
            CLIENT_ID=$(jq -r '.client_id' /tmp/gcp-creds.json)
            CLIENT_SECRET=$(jq -r '.client_secret' /tmp/gcp-creds.json)
            REFRESH_TOKEN=$(jq -r '.refresh_token' /tmp/gcp-creds.json)
            ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=$CLIENT_ID" \
              -d "client_secret=$CLIENT_SECRET" \
              -d "refresh_token=$REFRESH_TOKEN" \
              -d "grant_type=refresh_token" | jq -r '.access_token')
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          else
            gcloud auth activate-service-account --key-file=/tmp/gcp-creds.json --project=${{ env.GCP_PROJECT_ID }}
            ACCESS_TOKEN=$(gcloud auth print-access-token)
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          fi

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Sincronizar Repositorio Artifact Registry en Estado
        run: |
          terraform state show google_artifact_registry_repository.mobile_repo >/dev/null 2>&1 || \
          terraform import google_artifact_registry_repository.mobile_repo projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/repositories/${{ env.ARTIFACT_REGISTRY }} || true

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ==============================================================================
  # 4. DESPLIEGUE FINAL (CLOUD RUN & VERIFICACIÓN)
  # ==============================================================================
  deploy:
    name: Deploy - Cloud Run & Summary
    needs: [terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud
        run: |
          cat << 'EOF' > /tmp/gcp-creds.json
          ${{ secrets.GCP_SA_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> $GITHUB_ENV
          echo "CLOUDSDK_CORE_PROJECT=${{ env.GCP_PROJECT_ID }}" >> $GITHUB_ENV
          CRED_TYPE=$(jq -r '.type' /tmp/gcp-creds.json)
          if [ "$CRED_TYPE" = "authorized_user" ]; then
            CLIENT_ID=$(jq -r '.client_id' /tmp/gcp-creds.json)
            CLIENT_SECRET=$(jq -r '.client_secret' /tmp/gcp-creds.json)
            REFRESH_TOKEN=$(jq -r '.refresh_token' /tmp/gcp-creds.json)
            ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -d "client_id=$CLIENT_ID" \
              -d "client_secret=$CLIENT_SECRET" \
              -d "refresh_token=$REFRESH_TOKEN" \
              -d "grant_type=refresh_token" | jq -r '.access_token')
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          else
            gcloud auth activate-service-account --key-file=/tmp/gcp-creds.json --project=${{ env.GCP_PROJECT_ID }}
            ACCESS_TOKEN=$(gcloud auth print-access-token)
            echo "::add-mask::$ACCESS_TOKEN"
            echo "CLOUDSDK_AUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
            echo "GOOGLE_OAUTH_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          fi

      - name: Desplegar en Cloud Run (gcloud run deploy)
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE_URI" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Obtener URLs de Acceso y Resumen de Despliegue
        run: |
          echo "=================================================="
          echo "🚀 DESPLIEGUE SERVERLESS EXITOSO EN GOOGLE CLOUD"
          echo "=================================================="
          CLOUD_RUN_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          GATEWAY_URL=$(gcloud api-gateway gateways describe mobile-api-gateway \
            --location ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(defaultHostname)' || true)
          echo "URL Cloud Run: $CLOUD_RUN_URL"
          echo "Health Check:  $CLOUD_RUN_URL/health"
          if [ -n "$GATEWAY_URL" ]; then
            echo "URL API Gateway: https://$GATEWAY_URL"
          fi
          echo "=================================================="
          curl -s "$CLOUD_RUN_URL/health" || true
